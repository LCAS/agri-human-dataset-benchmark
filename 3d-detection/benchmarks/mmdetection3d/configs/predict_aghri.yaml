    checkpoint: /workspace/agri-human-dataset-benchmark/3d-detection/reports/benchmarks/mmdetection3d/runs/aghri-3d-detection/pointpillars_aghri/best_aghri_bev_ap_mean_epoch_66.pth

  - name: second_aghri
