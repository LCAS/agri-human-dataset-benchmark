points_dir: /workspace/data/mmdet3d_lidar_aghri/points/footpath1_p1_oj+mk+gl_1walk+check_st_11_12_2024_1_label

# Output directory — one sub-folder per model, one JSON per frame.
output_dir: /workspace/agri-human-dataset-benchmark/3d-detection/reports/detections

models:
